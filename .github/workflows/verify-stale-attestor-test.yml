name: Verify stale attestor update regression

on:
  push:
    branches:
      - test/reject-stale-attestor-update
    paths:
      - ".github/workflows/verify-stale-attestor-test.yml"
      - "x/opchild/keeper/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stale-attestor-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-test:
    name: Run stale attestor update regression test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out fork branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run focused regression test
        run: go test ./x/opchild/keeper -run '^Test_HandleAttestorSetUpdatePacket_RejectsStaleL1BlockHeight$' -count=1 -v
